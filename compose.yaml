services:
  db:
    image: postgres:16-alpine
    container_name: uaidevs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uaidevs}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-uaidevs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uaidevs-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaidevs-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: UaiDevs.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_URL: ${ADMIN_URL:-admin/}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-uaidevs}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 UaiDevs.wsgi:application"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - uaidevs-network

volumes:
  postgres_data:

networks:
  uaidevs-network:
    driver: bridge
