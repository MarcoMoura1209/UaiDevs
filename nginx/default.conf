server {
    listen 80;
    server_name uaidevs.com.br www.uaidevs.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Usar enquanto não tiver o certificado ssl
    # quando tiver o certificado comenta esse bloco do location /
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # e descomenta tambem essa linha quando tiver ssl pra redirecionar
    # return 301 https://$host$request_uri;
}

